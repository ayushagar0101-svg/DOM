<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="image">this is text</div>

    <p id="message"></p>
    <button id="btn">Click me</button>
</body>
<script>
   
    //first-function

   let button = document.getElementById("btn")

   button.addEventListener("click",function(){
    document.getElementById("message").innerText = "this add event handler";
   });

   //second-function
   button.addEventListener("click",function(){
   document.getElementById("message").style.color = "red"
   document.getElementById("message").style.fontSize = "20px"
   document.getElementById("message").style.border = "2px solid black";

   });

   //third-function
   button.addEventListener("click",Image)

   function Image (){

    document.getElementById("image").style.backgroundImage = "url(./img.png)"
    document.getElementById("image").style.width = "80vw"
    document.getElementById("image").style.height = "80vh"
   }

   b
</script>
</html>
